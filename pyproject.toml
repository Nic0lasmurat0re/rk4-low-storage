[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsrk"
version = "1.0.0"
description = "Low-storage Runge-Kutta methods for spacecraft thermal simulation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicolas Muratore" }, { name = "Mohamad Rida" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "numexpr"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
